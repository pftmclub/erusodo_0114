services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql2025
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1434:1433"
    volumes:
      - sqldata2025:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqldata2025: